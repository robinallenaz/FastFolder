
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastFolder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>FastFolder</h1>
      <div id="currentFolder">
        <span class="label">Folder:</span>
        <span id="folderName" class="value">—</span>
        <button id="changeFolder" title="Choose a different folder">Change</button>
      </div>
      <input id="search" type="search" placeholder="Filter… (title or URL)" autocomplete="off" />
    </header>
    <main>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty hidden">No bookmarks found.</div>
      <div id="chooseFirst" class="empty hidden">
        Pick a folder first → <button id="openOptions">Open Options</button>
      </div>
    </main>
    <footer>
      <button id="refresh">Refresh</button>
      <span class="hint">Tip: Ctrl/Cmd-click opens in background</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
